[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "latedeliveries"
version = "0.1.0"
description = "Predict late deliveries for QuickBite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn",
    "pandas",
    "matplotlib",
    "pytest",
    "ruff",
    "ipykernel"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
